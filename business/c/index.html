<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catalogue · Livinai</title>
<meta name="description" content="A furniture catalogue made with Livinai.">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf8f3;--bg-2:#f3eee4;--bg-3:#ebe4d6;--ink:#111a15;--ink-2:#2b3530;--muted:#646d67;--faint:#949b95;--line:rgba(17,26,21,.09);--line-2:rgba(17,26,21,.16);--green:#164a37;--green-2:#1f5d46;--sage:#e8eee8;--gold:#b4874a;--gold-3:#f4e9d6;--serif:"Fraunces",Georgia,serif;--sans:"Inter",system-ui,sans-serif;--sh:0 1px 2px rgba(17,26,21,.04),0 16px 40px -16px rgba(17,26,21,.2);--sh3:0 2px 6px rgba(17,26,21,.04),0 40px 80px -32px rgba(17,26,21,.34);--ease:cubic-bezier(.22,.7,.2,1);color-scheme:light}
[hidden]{display:none!important}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}a{color:inherit}button{font:inherit;color:inherit}
.wrap{width:min(1200px,calc(100% - 40px));margin-inline:auto}
header.top{border-bottom:1px solid var(--line);background:rgba(250,248,243,.85);backdrop-filter:blur(12px);position:sticky;top:0;z-index:5}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;height:64px}
.brand{display:inline-flex;align-items:center;font-weight:600;letter-spacing:-.01em;text-decoration:none}
.brand img{max-height:36px;max-width:180px;width:auto}
.actions{display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line-2);background:#fff;font-size:.88rem;font-weight:500;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn.p{background:var(--green);color:#fff;border-color:var(--green)}
.btn svg{width:15px;height:15px}
.hero{padding:clamp(48px,7vw,88px) 0 clamp(32px,4vw,48px)}
.eyebrow{font-size:.75rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--green-2)}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(2.6rem,6vw,4.6rem);letter-spacing:-.03em;line-height:1;margin:14px 0 12px}
.hero p{color:var(--muted);max-width:56ch}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding-bottom:80px}
.card{border-radius:24px;background:#fff;border:1px solid var(--line);overflow:hidden;cursor:pointer;transition:transform .3s var(--ease),box-shadow .3s;display:flex;flex-direction:column;text-align:left;padding:0}
.card:hover{transform:translateY(-3px);box-shadow:var(--sh)}
.card .im{aspect-ratio:4/3;background:var(--bg-2);position:relative;overflow:hidden}
.card .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1s var(--ease)}
.card .im img.cut{object-fit:contain;padding:12%}
.card:hover .im img{transform:scale(1.03)}
.card .mini{position:absolute;right:10px;bottom:10px;width:64px;height:64px;border-radius:12px;background:rgba(255,255,255,.92);padding:6px;box-shadow:var(--sh)}
.card .mini img{position:static;width:100%;height:100%;object-fit:contain}
.card .tx{padding:18px 20px 20px;display:grid;gap:4px}
.card b{font-size:1.02rem;font-weight:600}
.card .row{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:.88rem}
.card .price{color:var(--ink);font-weight:600}
.state{padding:120px 20px;text-align:center;color:var(--muted)}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid #d2dfd5;border-top-color:var(--green);animation:spin .8s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
footer{border-top:1px solid var(--line);padding:28px 0;color:var(--faint);font-size:.85rem}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer a{color:var(--green);text-decoration:none;font-weight:500}
/* product sheet */
.sheet{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px}
.sheet[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(14,22,18,.55);backdrop-filter:blur(4px)}
.panel{position:relative;width:min(1080px,100%);max-height:calc(100vh - 32px);overflow:auto;background:#fff;border-radius:28px;box-shadow:var(--sh3);display:grid;grid-template-columns:1.25fr .75fr}
.x{position:absolute;top:14px;right:14px;z-index:3;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.9);font-size:1.4rem;cursor:pointer;box-shadow:var(--sh)}
.gal{background:var(--bg-2);display:grid;grid-template-rows:1fr auto;min-height:420px}
.gal .main{position:relative;min-height:320px}
.gal .main img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.gal .main img.cut{object-fit:contain;padding:10%}
.thumbs{display:flex;gap:8px;padding:10px;overflow-x:auto}
.thumbs button{flex:none;width:76px;height:56px;border-radius:10px;overflow:hidden;border:2px solid transparent;padding:0;cursor:pointer;background:#fff}
.thumbs button[aria-pressed=true]{border-color:var(--green)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.thumbs img.cut{object-fit:contain;padding:4px}
.info{padding:32px;display:grid;gap:14px;align-content:start}
.info h2{font-family:var(--serif);font-weight:400;font-size:2rem;letter-spacing:-.02em;line-height:1.05;margin:0}
.info .pr{font-size:1.3rem;font-weight:600}
.info p{color:var(--muted);margin:0}
.specs{display:grid;gap:0;border-top:1px solid var(--line)}
.specs div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.specs span{color:var(--muted)}
.sw{display:flex;gap:6px}.sw i{width:20px;height:20px;border-radius:50%;box-shadow:0 0 0 1px var(--line-2)}
.info .btn{justify-content:center;height:48px}
.tryframe{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px}
.tryframe[hidden]{display:none}
.tryframe iframe{position:relative;width:min(720px,100%);height:min(720px,calc(100vh - 32px));border:0;border-radius:24px;background:#fff;box-shadow:var(--sh3)}
@media (max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.panel{grid-template-columns:1fr}.gal{min-height:0}.gal .main{aspect-ratio:4/3;min-height:0}}
@media (max-width:560px){.grid{grid-template-columns:1fr}.actions .btn span{display:none}}
/* print: a lookbook */
@media print{
  @page{margin:14mm}
  header.top,.actions,footer .wrap > a,.sheet,.tryframe{display:none!important}
  body{background:#fff}
  .hero{padding:0 0 10mm}
  .grid{display:block}
  .card{break-inside:avoid;page-break-inside:avoid;border:0;border-radius:0;margin:0 0 10mm;box-shadow:none!important;transform:none!important}
  .card .im{aspect-ratio:16/9;border-radius:6mm}
  .card .tx{padding:4mm 0 0}
  .print-scenes{display:grid!important;grid-template-columns:repeat(3,1fr);gap:3mm;margin-top:3mm}
  .print-scenes img{aspect-ratio:4/3;object-fit:cover;border-radius:3mm}
}
.print-scenes{display:none}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" id="brand" href="#">Catalogue</a>
    <div class="actions">
      <button class="btn" id="shareBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg><span>Share</span></button>
      <button class="btn" id="pdfBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M14 3.5H7A1.5 1.5 0 0 0 5.5 5v14A1.5 1.5 0 0 0 7 20.5h10a1.5 1.5 0 0 0 1.5-1.5V8Z"/><path d="M14 3.5V8h4.5"/></svg><span>PDF</span></button>
      <a class="btn p" id="siteBtn" hidden target="_blank" rel="noopener">Visit store</a>
    </div>
  </div>
</header>
<main>
  <div id="state" class="state"><div class="spin"></div>Loading catalogue…</div>
  <section class="hero wrap" id="hero" hidden>
    <div class="eyebrow" id="brandEy"></div>
    <h1 id="title"></h1>
    <p id="sub"></p>
  </section>
  <section class="wrap grid" id="grid" hidden></section>
</main>
<footer><div class="wrap"><span id="foot"></span><a href="https://livinai.app/business/" target="_blank" rel="noopener" id="madeWith">Made with Livinai</a></div></footer>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true">
  <div class="scrim" data-close></div>
  <div class="panel">
    <button class="x" data-close aria-label="Close">×</button>
    <div class="gal"><div class="main"><img id="gMain" alt=""></div><div class="thumbs" id="gThumbs"></div></div>
    <div class="info">
      <div class="eyebrow" id="iCat"></div>
      <h2 id="iName"></h2>
      <div class="pr" id="iPrice"></div>
      <p id="iDesc"></p>
      <div class="specs" id="iSpecs"></div>
      <button class="btn p" id="tryBtn" hidden>See it in your room</button>
      <a class="btn" id="buyBtn" hidden target="_blank" rel="noopener">View product</a>
    </div>
  </div>
</div>
<div class="tryframe" id="tryFrame" hidden><div class="scrim" data-close></div><iframe id="tryIf" title="See it in your room" allow="camera"></iframe></div>

<script src="../biz.js"></script>
<script>
(async () => {
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const qs = new URLSearchParams(location.search), id = qs.get('id');
  const state = $('#state');
  if (!id) { state.textContent = 'This catalogue link is missing its id.'; return; }
  let cat;
  try { cat = (await Biz.call('/catalogues/' + encodeURIComponent(id))).catalogue; }
  catch (e) { state.textContent = e.status === 404 ? 'This catalogue could not be found.' : e.message; return; }

  document.title = `${cat.title}${cat.brand ? ' · ' + cat.brand : ''}`;
  if (/^#[0-9a-f]{6}$/i.test(cat.brandColor || '')) { const r = document.documentElement.style; r.setProperty('--green', cat.brandColor); r.setProperty('--green-2', cat.brandColor); }
  if (cat.hideBranding) $('#madeWith').hidden = true;
  if (cat.logoUrl) { const im = new Image(); im.src = cat.logoUrl; im.alt = cat.brand || 'Logo'; $('#brand').replaceChildren(im); } else $('#brand').textContent = cat.brand || 'Catalogue';
  $('#brandEy').textContent = cat.brand ? `${cat.brand} · Collection` : 'Collection';
  $('#title').textContent = cat.title;
  const sceneCount = cat.products.reduce((n, p) => n + p.scenes.length, 0);
  $('#sub').textContent = `${cat.products.length} ${cat.products.length === 1 ? 'piece' : 'pieces'}${sceneCount ? `, shown in ${sceneCount} styled ${sceneCount === 1 ? 'room' : 'rooms'}` : ''}. Tap a piece to see more${cat.tryonEnabled ? ' or try it in your own room' : ''}.`;
  $('#foot').textContent = `© ${new Date().getFullYear()} ${cat.brand || ''}`.trim();
  if (cat.website) { $('#siteBtn').href = cat.website; $('#siteBtn').hidden = false; }
  state.hidden = true; $('#hero').hidden = false; $('#grid').hidden = false;

  $('#grid').innerHTML = cat.products.map((p, i) => {
    const hero = p.scenes[0];
    return `<button class="card" data-i="${i}">
      <div class="im">${hero ? `<img src="${esc(hero.imageUrl)}" alt="${esc(p.name)} in a styled room" loading="lazy"><span class="mini"><img src="${esc(p.cutoutUrl)}" alt=""></span>` : `<img class="cut" src="${esc(p.cutoutUrl)}" alt="${esc(p.name)}" loading="lazy">`}</div>
      <div class="tx"><b>${esc(p.name)}</b><div class="row"><span>${esc(p.material || p.category || '')}</span><span class="price">${esc(p.price || '')}</span></div></div>
      <div class="print-scenes">${p.scenes.slice(1, 4).map(s => `<img src="${esc(s.imageUrl)}" alt="">`).join('')}</div>
    </button>`;
  }).join('');

  const sheet = $('#sheet');
  let cur = null;
  function openProduct(p) {
    cur = p;
    const imgs = [...p.scenes.map(s => ({ src: s.imageUrl, cut: false, label: `${s.style} ${s.room}` })), { src: p.cutoutUrl, cut: true, label: 'Product' }];
    const show = (k) => { const m = $('#gMain'); m.src = imgs[k].src; m.className = imgs[k].cut ? 'cut' : ''; m.alt = `${p.name}: ${imgs[k].label}`; [...$('#gThumbs').children].forEach((b, j) => b.setAttribute('aria-pressed', j === k)); };
    $('#gThumbs').innerHTML = imgs.map((im, k) => `<button aria-label="${esc(im.label)}"><img class="${im.cut ? 'cut' : ''}" src="${esc(im.src)}" alt=""></button>`).join('');
    [...$('#gThumbs').children].forEach((b, k) => b.onclick = () => show(k));
    show(0);
    $('#iCat').textContent = p.category || ''; $('#iName').textContent = p.name; $('#iPrice').textContent = p.price || ''; $('#iDesc').textContent = p.description || '';
    $('#iSpecs').innerHTML = [['Size', p.dims], ['Material', p.material], ['SKU', p.sku]].filter(r => r[1]).map(r => `<div><span>${r[0]}</span><b>${esc(r[1])}</b></div>`).join('')
      + (p.colors?.length ? `<div><span>Colours</span><span class="sw">${p.colors.map(c => `<i style="background:${esc(c)}"></i>`).join('')}</span></div>` : '');
    $('#buyBtn').hidden = !p.url; if (p.url) $('#buyBtn').href = p.url;
    $('#tryBtn').hidden = !cat.tryonEnabled;
    sheet.hidden = false;
  }
  $('#grid').addEventListener('click', e => { const c = e.target.closest('.card'); if (c) openProduct(cat.products[+c.dataset.i]); });
  document.addEventListener('click', e => { if (e.target.closest('[data-close]')) { sheet.hidden = true; $('#tryFrame').hidden = true; $('#tryIf').src = 'about:blank'; } });
  addEventListener('keydown', e => { if (e.key === 'Escape') { sheet.hidden = true; $('#tryFrame').hidden = true; } });
  $('#tryBtn').addEventListener('click', () => { $('#tryIf').src = `../try/?c=${encodeURIComponent(cat.id)}&p=${encodeURIComponent(cur.id)}`; $('#tryFrame').hidden = false; });
  addEventListener('message', e => { if (e.data === 'livinai-try-close') { $('#tryFrame').hidden = true; } });

  $('#shareBtn').addEventListener('click', async () => {
    const url = location.href.split('&print')[0];
    try { if (navigator.share) await navigator.share({ title: document.title, url }); else { await navigator.clipboard.writeText(url); $('#shareBtn').lastChild.textContent = 'Copied'; } } catch { /* cancelled */ }
  });
  const printNow = async () => {
    await Promise.all([...document.images].map(im => im.complete ? 0 : new Promise(r => { im.onload = im.onerror = r; })));
    print();
  };
  $('#pdfBtn').addEventListener('click', () => { document.querySelectorAll('img[loading=lazy]').forEach(i => i.loading = 'eager'); printNow(); });
  if (qs.get('print') === '1') { document.querySelectorAll('img[loading=lazy]').forEach(i => i.loading = 'eager'); setTimeout(printNow, 300); }
})();
</script>
</body>
</html>
